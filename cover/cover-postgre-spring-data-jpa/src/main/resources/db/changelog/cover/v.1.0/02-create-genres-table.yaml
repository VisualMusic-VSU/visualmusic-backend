databaseChangeLog:
  - changeSet:
      id: 02-create-genres-table__create-table
      author: popipopka
      changes:
        - createTable:
            tableName: genres
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(32)
                  constraints:
                    nullable: false
                    unique: true
      rollback:
        - dropTable:
            tableName: genres