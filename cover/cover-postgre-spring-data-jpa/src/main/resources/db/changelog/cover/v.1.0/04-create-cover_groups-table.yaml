databaseChangeLog:
  - changeSet:
      id: 04-create-cover_groups-table__create-table
      author: popipopka
      changes:
        - createTable:
            tableName: cover_groups
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(70)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: is_private
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: mood_id
                  type: bigint
              - column:
                  name: style_id
                  type: bigint
              - column:
                  name: lyrics
                  type: text
              - column:
                  name: prompt
                  type: text

      rollback:
        - dropTable:
            tableName: cover_groups

  - changeSet:
      id: 04-create-cover_groups-table__add-fk
      author: popipopka
      changes:
        - addForeignKeyConstraint:
            baseTableName: cover_groups
            baseColumnNames: mood_id
            referencedTableName: moods
            referencedColumnNames: id
            constraintName: fk_cover_groups_moods
        - addForeignKeyConstraint:
            baseTableName: cover_groups
            baseColumnNames: style_id
            referencedTableName: styles
            referencedColumnNames: id
            constraintName: fk_cover_groups_styles
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: cover_groups
            constraintName: fk_cover_groups_moods
        - dropForeignKeyConstraint:
            baseTableName: cover_groups
            constraintName: fk_cover_groups_styles