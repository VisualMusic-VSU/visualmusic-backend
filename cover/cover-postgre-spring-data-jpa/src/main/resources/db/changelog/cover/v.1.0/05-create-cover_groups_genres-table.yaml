databaseChangeLog:
  - changeSet:
      id: 05-create-cover_groups_genres-table__create-table
      author: popipopka
      changes:
        - createTable:
            tableName: cover_groups_genres
            columns:
              - column:
                  name: cover_group_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: genre_id
                  type: bigint
                  constraints:
                    nullable: false
      rollback:
          - dropTable:
              tableName: cover_groups_genres

  - changeSet:
      id: 05-create-cover_groups_genres-table__add-pk
      author: popipopka
      changes:
        - addPrimaryKey:
            tableName: cover_groups_genres
            columnNames: cover_group_id, genre_id
            constraintName: pk_cover_group_id_genre_id
      rollback:
        - dropPrimaryKey:
            tableName: cover_groups_genres
            constraintName: pk_cover_group_id_genre_id

  - changeSet:
      id: 05-create-cover_groups_genres-table__add-fk
      author: popipopka
      changes:
        - addForeignKeyConstraint:
            baseTableName: cover_groups_genres
            baseColumnNames: cover_group_id
            referencedTableName: cover_groups
            referencedColumnNames: id
            constraintName: fk_cover_groups_genres_cover_groups
        - addForeignKeyConstraint:
            baseTableName: cover_groups_genres
            baseColumnNames: genre_id
            referencedTableName: genres
            referencedColumnNames: id
            constraintName: fk_cover_groups_genres_genres
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: cover_groups_genres
            constraintName: fk_cover_groups_genres_cover_groups
        - dropForeignKeyConstraint:
            baseTableName: cover_groups_genres
            constraintName: fk_cover_groups_genres_genres
