services:
  auth-postgres:
    image: postgres:17
    container_name: auth-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: auth
    volumes:
      - ./docker/data/postgres/auth:/var/lib/postgresql/data
    ports:
      - "5440:5432"

  cover-postgres:
    image: postgres:17
    container_name: cover-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: cover
    volumes:
      - ./docker/data/postgres/cover:/var/lib/postgresql/data
    ports:
      - "5441:5432"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: minio
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: 12345678
    volumes:
      - ./docker/data/minio:/data
    command: server /data --console-address ":9001"
    ports:
      - "9900:9000"
      - "9901:9001"

  visualmusic-app:
    depends_on:
      - auth-postgres
      - cover-postgres
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: /app/build/libs/visualmusic.jar
    container_name: visualmusic-app
    environment:
      AUTH_POSTGRES_URL: jdbc:postgresql://auth-postgres:5440/auth
      COVER_POSTGRES_URL: jdbc:postgresql://cover-postgres:5441/auth
    ports:
      - "8080:8080"
