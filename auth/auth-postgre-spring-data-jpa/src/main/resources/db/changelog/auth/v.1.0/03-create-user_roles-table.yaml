databaseChangeLog:
  - changeSet:
      id: 03-create-user_roles-table__create-table
      author: popipopka
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: user_roles

  - changeSet:
      id: 03-create-user_roles-table__add-pk
      author: popipopka
      changes:
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_id_role_id
      rollback:
        - dropPrimaryKey:
            tableName: user_roles
            constraintName: pk_user_id_role_id

  - changeSet:
      id: 03-create-user_roles-table__add-fk
      author: popipopka
      changes:
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_users
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_roles
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: user_roles
            constraintName: fk_user_roles_users
        - dropForeignKeyConstraint:
            baseTableName: user_roles
            constraintName: fk_user_roles_roles