name: Deploy to Dev Server

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew :app-spring-boot:build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set short SHA to ENV
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set lowercase repository name
        run: echo "REPO_NAME_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_NAME_LC }}:${{ env.SHORT_SHA }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA to ENV
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.DEPLOY_SERVER_HOST }}

      - name: Copy docker-compose.yaml
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }} << 'EOF'
            mkdir -p visualmusic/backend/develop
          EOF
          scp -o StrictHostKeyChecking=no \
            docker-compose.yaml \
            ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:./visualmusic/backend/develop/

      - name: Set lowercase repository name
        run: echo "REPO_NAME_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }} << 'EOF'
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" > ./visualmusic/backend/develop/.env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ./visualmusic/backend/develop/.env
          
          echo "AUTH_POSTGRES_DB=${{ secrets.AUTH_POSTGRES_DB }}" >> ./visualmusic/backend/develop/.env
          echo "AUTH_POSTGRES_PORT=${{ secrets.AUTH_POSTGRES_PORT }}" >> ./visualmusic/backend/develop/.env
          echo "AUTH_POSTGRES_URL=${{ secrets.AUTH_POSTGRES_URL }}" >> ./visualmusic/backend/develop/.env
          
          echo "COVER_POSTGRES_DB=${{ secrets.COVER_POSTGRES_DB }}" >> ./visualmusic/backend/develop/.env
          echo "COVER_POSTGRES_PORT=${{ secrets.COVER_POSTGRES_PORT }}" >> ./visualmusic/backend/develop/.env
          echo "COVER_POSTGRES_URL=${{ secrets.COVER_POSTGRES_URL }}" >> ./visualmusic/backend/develop/.env
          
          echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> ./visualmusic/backend/develop/.env
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> ./visualmusic/backend/develop/.env
          
          echo "VISUALMUSIC_APP_PORT=${{ secrets.DEPLOY_VISUALMUSIC_APP_PORT }}" >> ./visualmusic/backend/develop/.env
          
          echo "ORG_NAME=${{ env.REPO_NAME_LC }}" >> ./visualmusic/backend/develop/.env
          echo "SHORT_SHA=${{ env.SHORT_SHA }}" >> ./visualmusic/backend/develop/.env
          EOF

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }} << 'EOF'
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u popipopka --password-stdin
          
            cd visualmusic/backend/develop
          
            docker compose down
            docker compose up -d
          EOF
